<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home — Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tracker: { 50: '#eff6ff', 500: '#2563eb', 600: '#1d4ed8', 700: '#1e40af' },
            success: { 50: '#ecfdf5', 500: '#047857' }, // ISS-001: darkened from #10b981 — white toast text now hits ~5.48:1 contrast (was 2.54:1, failed WCAG AA)
          },
          spacing: {
            '3xs': '2px', '2xs': '4px', xs: '8px', sm: '12px',
            md: '16px', lg: '24px', xl: '32px', '2xl': '48px', '3xl': '64px',
          },
          fontSize: {
            xs: '12px', sm: '14px', md: '16px', lg: '18px',
            xl: '20px', '2xl': '24px', '3xl': '30px',
          },
          screens: { desktop: '640px' },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="components/dev-mode.css" />
  <style>
    /* Toast animations — home-toast (spec: appears, stacks, ~2.5s auto-dismiss) */
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes toast-out {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-8px); }
    }
    .animate-toast-in { animation: toast-in 0.2s ease-out; }
    .animate-toast-out { animation: toast-out 0.2s ease-in forwards; }

    /* Hide Dev Mode's toggle while an overlay is open — see components/modal.js */
    body.overlay-open #dev-mode-toggle { display: none; }

    /* Saving-state spinner — home-confirm-submit */
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #fff;
      border-radius: 50%;
      display: inline-block;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen bg-gray-50">
  <!-- Dev Mode (Object ID copy-to-clipboard for feedback) -->
  <button id="dev-mode-toggle" class="dev-mode-toggle" title="Toggle Dev Mode (Ctrl+E)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
      <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
    </svg>
    <span>Dev Mode: OFF</span>
  </button>
  <div id="dev-mode-tooltip" class="dev-mode-tooltip" style="display: none;"></div>

  <div id="app" class="max-w-[900px] mx-auto px-md desktop:px-xl py-lg">
    <div class="flex flex-col desktop:flex-row desktop:gap-xl gap-xl">
      <section id="quick-add-root" class="desktop:w-[400px] desktop:shrink-0"></section>
      <section id="recent-entries-root" class="flex-1"></section>
    </div>
  </div>

  <div id="popup-root"></div>
  <div id="toast-root" class="fixed top-md right-md flex flex-col gap-xs z-50"></div>

  <script src="data/demo-data.js"></script>
  <script src="shared/utils.js"></script>
  <script src="shared/prototype-api.js"></script>
  <script src="components/modal.js"></script>
  <script src="components/toast.js"></script>
  <script src="components/dev-mode.js"></script>
  <script src="pages/home.js"></script>
  <script src="shared/init.js"></script>
</body>
</html>
