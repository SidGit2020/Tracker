# ============================================================================
# JAVASCRIPT REQUIREMENTS
# ============================================================================

javascript_functions:
  initialization:
    - "initPage() - loads demo data, renders Recent Entries, resets Quick Add to idle"

  form_handling:
    - "handleCategorySelect(category) - selects preset, deselects others/custom"
    - "handleCustomCategoryInput(value) - sets custom category, case-insensitive merge check"
    - "validateQuickAdd() - amount > 0 AND category set, toggles submit disabled state"
    - "handleAddExpense() - opens Confirm Popup with current amount/category"

  popup_handling:
    - "openConfirmPopup(amount, category)"
    - "handleInlineEdit(field) - enters edit mode for amount or category within popup"
    - "handleCancel() - closes popup, Home retains filled amount/category"
    - "handleConfirmSave() - pessimistic save via PrototypeAPI, shows Saving state, then toast + list update"

  ui_interactions:
    - "handleCountSelectorChange(count) - limits visible Recent Entries rows"
    - "showToast(message) - stacking, independent ~2.5s auto-dismiss timers"

  api_calls:
    - "PrototypeAPI.getEntries()"
    - "PrototypeAPI.addEntry({ amount, category })"

  feedback:
    - "showToast(message, type)"
    - "setSavingState(isSaving)"
    - "highlightNewRow(entryId)"

