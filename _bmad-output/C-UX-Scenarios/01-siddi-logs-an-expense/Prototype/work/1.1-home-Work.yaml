# ============================================================================
# PAGE REQUIREMENTS (from specification)
# ============================================================================

page_purpose: |
  Siddi's single entry point: log an expense in a couple of taps (Quick Add),
  confirm it before it's committed (Confirm Popup overlay), and see it register
  (toast + updated Recent Entries list) — no navigation, no menu, no login.

user_context:
  - Siddi opens the bookmarked/pinned app right after paying for something
  - Recent entries for the current month may already exist (or list is empty)
  - No running month total shown here — that lives on the Monthly Breakdown page (scenario 02)

success_criteria:
  - Amount + category can be entered and submitted in a couple of taps
  - Confirm popup shows entry summary before it's saved (pessimistic save)
  - Cancel returns to Home with fields still filled (not cleared)
  - Successful save shows a toast, resets Quick Add to idle, and adds the new entry to the top of Recent Entries
  - Custom category input merges case-insensitively with existing categories (presets + prior custom values), no duplicates
  - Multiple rapid saves stack toasts vertically, each with an independent ~2.5s timer

