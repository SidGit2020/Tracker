# ============================================================================
# PAGE REQUIREMENTS (from specification)
# ============================================================================

page_purpose: |
  Siddi's unhurried monthly review: see per-category totals at a glance
  (headline total + bar chart), browse past months, and drill into a
  category's individual transactions to spot-check the number against memory.

user_context:
  - Siddi opens the app near month-end specifically to review, not to log anything
  - Multi-month history exists (April-July 2026 in demo data)
  - Current month (July 2026) is the default view on load

success_criteria:
  - Total + bar chart reflect the selected month, re-normalizing bar widths to that month's largest category
  - Month selector defaults to current month; prev disables at the earliest month with data, next disables at the current month
  - Clicking a category bar opens a read-only drill-down panel for that category's transactions in the selected month
  - Drill-down list is sorted most-recent-first
  - Empty months show "No entries for {Month} {Year}" with no CTA

# ============================================================================
# DEMO DATA REQUIREMENTS
# ============================================================================

demo_data_needed:
  current_user:
    firstName: "Siddi"

  months_covered: "April 2026 (earliest) through July 2026 (current)"
  july_totals: "Food 4200 / Shopping 3100 / Transport 2800 / Other 2350 = Rs 12,450 (matches spec mockup)"
  edge_cases_in_data:
    - "April has only 2 of 4 categories (tests category-set changes month to month)"
    - "June includes a custom category (Books) not in the preset list"

